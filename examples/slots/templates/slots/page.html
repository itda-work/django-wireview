{% load wireview %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slots</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 880px;
        margin: 24px auto;
        padding: 0 20px;
        color: #1f2937;
        background: #f3f4f6;
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .lead { color: #6b7280; margin: 0 0 16px; font-size: 14px; }
      .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
      .toolbar button {
        padding: 6px 14px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        font-size: 14px;
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      .card { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); overflow: hidden; }
      .card-header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; }
      .card-header h3 { margin: 0; font-size: 16px; }
      .card-body { padding: 12px 16px; }
      .card-footer { padding: 10px 16px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 13px; }
      .card-accent .card-header { background: #eef2ff; }
      .list { list-style: none; margin: 0; padding: 0; }
      .list-item { padding: 6px 0; border-bottom: 1px dashed #e5e7eb; display: flex; gap: 10px; align-items: baseline; }
      .list-item:last-child { border-bottom: none; }
      .book-index { color: #9ca3af; font-variant-numeric: tabular-nums; width: 1.5em; }
      .book-note { color: #6b7280; font-size: 13px; margin-left: auto; }
      .alert { padding: 10px 14px; border-radius: 6px; display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
      .alert-info { background: #dbeafe; color: #1e40af; }
      .alert-success { background: #dcfce7; color: #166534; }
      .alert-warning { background: #fef9c3; color: #854d0e; }
      .alert-error { background: #fee2e2; color: #991b1b; }
      .alert-icon { font-size: 18px; }
      .modal { display: none; }
      .modal.is-open { display: block; margin-top: 16px; }
      .modal-content { background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); border: 1px solid #e5e7eb; }
      .modal-header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
      .modal-body { padding: 12px 16px; }
      .modal-footer { padding: 10px 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; justify-content: flex-end; }
      .pill { padding: 4px 10px; border-radius: 999px; background: #eef2ff; color: #3730a3; font-size: 13px; }
    </style>
    {% wireview_header %}
  </head>
  <body>
    {% component "SlotsGallery" id="gallery" %}
  </body>
</html>
