{% load wireview %}

<div {% tag_header %}>
  <div class="online-users" style="
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 16px;
    background: white;
  ">
    <h3 style="font-size: 14px; margin-bottom: 12px; color: #666;">
      Online Users ({{ this.online_users|length }})
    </h3>
    <ul style="list-style: none;">
      {% for username, is_typing in this.online_users.items %}
        <li style="margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
          <span style="
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
          "></span>
          <span>{{ username }}</span>
          {% if is_typing %}
            <span style="font-size: 12px; color: #999; font-style: italic;">typing...</span>
          {% endif %}
        </li>
      {% empty %}
        <li style="color: #999; font-size: 14px;">No users online</li>
      {% endfor %}
    </ul>
  </div>
</div>
