{% load wireview %}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Feed</title>
    {% wireview_header %}
  </head>
  <body>
    {% if mode == "notified" %}
      {% component "NotifiedFeed" id="feed" %}
    {% else %}
      {% component "Feed" id="feed" %}
    {% endif %}
  </body>
</html>
