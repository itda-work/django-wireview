name: Release

# Tag push (v*) -> build -> publish to PyPI via trusted publishing -> GitHub release.
#
# Nothing is published unless the tagged commit passes the whole CI workflow
# (ci.yml, called here: the Python x Django matrix, the newest-dependencies run,
# E2E on NATS, lint, typecheck, the package build, the editor extension's checks
# and package; not its tests in a downloaded VS Code, which `release: true` skips)
# and the built wheel imports in
# a fresh environment on the newest dependencies (smoke). Before this gate a tag
# went to PyPI with no test run at all; 1.0.0rc3 went out importable only on the
# pydantic uv.lock pinned (#122, #127).
#
# PyPI side: pypi.org > Account settings > Publishing > pending publisher with
# owner itda-work, repository django-wireview, workflow release.yml, environment pypi.
# No API token is stored anywhere.
#
# A manual run (workflow_dispatch) is a dry run: it runs the same gate, builds and
# round-trips the artifact, and publishes nothing. It is how a change to this
# file, or an action bump, gets checked before the next tag depends on it (#105).
#
# Runners are pinned rather than ubuntu-latest, so a GitHub image migration does
# not land inside a release unannounced. Move the pin on purpose, with a dry run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # The tests, on exactly the commit being released: the caller's ref is the tag.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    permissions:
      contents: read

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Check that the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      # Builds the JS, builds the package, runs twine check, and fails if the wheel
      # is missing wireview.min.js (hatchling would drop it as a gitignored artifact).
      - name: Build and check
        run: make ci-build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The artifact the publish job would download comes back intact, and the wheel in
  # it imports and passes `check` in a fresh environment that resolves the
  # dependencies anew -- what `pip install django-wireview` gets today.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7 # for the Makefile and tests/wheel_smoke.py
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: List what would be published
        run: ls -l dist/ && test -n "$(ls dist/*.whl)" && test -n "$(ls dist/*.tar.gz)"

      - name: Import the wheel on the newest dependencies
        run: make ci-smoke

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, build, smoke]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: write # GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
