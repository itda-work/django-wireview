# The documentation site's table of contents: what itda.work/wireview/ publishes, in what order, at what address (#158).
#
# This file is the source of truth for the site navigation and for the tutorials' learning order.
# docs/tutorials/README.md (its learning path, level headings and time table) and every tutorial's
# closing navigation line are written for GitHub readers; tests/test_tutorials.py checks they say
# what this file says. tests/test_doc_site.py checks that every user document is classified here.
#
# Adding or moving a Markdown file under docs/ (or the root README.md) means classifying it here:
# either a page of a section below, or a pattern in [exclude]. An unclassified file fails the tests.
#
# URLs
#   base                        the site's root path, "/wireview/"
#   [home]                      <base>                               e.g. /wireview/
#   a section's index           <base><section slug>/                e.g. /wireview/tutorial/
#   a section's page            <base><section slug>/<page slug>/    e.g. /wireview/tutorial/todo-app/
#   Slugs are [a-z0-9-]+. A page slug is unique within its section and never carries a tutorial's
#   number, so reordering the path never moves a public URL. Changing a slug means adding an entry
#   to docs/redirects.toml.
#
# Titles
#   A page's title is its document's first line, "# <title>"; it is not repeated here.
#   A tutorial's short title (the README's learning path, the time table, the closing navigation
#   line) is that title up to the first " - ": "# 10. Poll 앱 - 실시간 투표" is "10. Poll 앱".
#
# Tutorials
#   The order of [[sections.pages]] in the tutorial section is the learning order.
#   level    the slug of one of [[levels]]; the path visits the levels in their order, each once.
#   minutes  the estimated time, an integer or a [low, high] range. The README writes it as
#            "30분", "1.5시간", "1-2시간" (human_minutes in scripts/docs_site/nav.py).
#   summary  the line after the tutorial's link in the README's learning path.

base = "/wireview/"

[home]
source = "README.md"

[[levels]]
slug = "intro"
name = "입문"
label = "Getting Started"

[[levels]]
slug = "beginner"
name = "초급"
label = "Beginner"

[[levels]]
slug = "intermediate"
name = "중급"
label = "Intermediate"

[[levels]]
slug = "advanced"
name = "고급"
label = "Advanced"

[[levels]]
slug = "deep-dive"
name = "심화"
label = "Deep Dive"

