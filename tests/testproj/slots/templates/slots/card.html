{% load wireview %}
<div {% tag_header %} class="card card-{{ variant }}">
  {% if slots.header %}
    <header class="card-header">
      {% render_slot "header" %}
    </header>
  {% elif title %}
    <header class="card-header">
      <h3>{{ title }}</h3>
    </header>
  {% endif %}

  <div class="card-body">
    {% render_slot %}
  </div>

  {% if slots.footer %}
    <footer class="card-footer">
      {% render_slot "footer" %}
    </footer>
  {% endif %}
</div>
