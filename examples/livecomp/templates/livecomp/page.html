<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveComponent E2E Test</title>
    <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .dashboard {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .dashboard-stats {
      font-size: 1.5em;
      font-weight: bold;
    }
    .dashboard-controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }
    .counters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .counter-widget {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .counter-label {
      margin: 0 0 10px 0;
      font-size: 1em;
    }
    .counter-value {
      font-size: 2em;
      font-weight: bold;
      margin: 10px 0;
    }
    .counter-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      background: #f5f5f5;
    }
    .btn:hover {
      background: #e5e5e5;
    }
    .btn-increment { background: #4caf50; color: white; border: none; }
    .btn-decrement { background: #f44336; color: white; border: none; }
    .btn-reset { background: #2196f3; color: white; border: none; }
    .btn-reset-all { background: #ff9800; color: white; border: none; }
    .btn-sync-all { background: #9c27b0; color: white; border: none; }
    </style>
  </head>
  <body>
    {% load wireview static %}

    {% component "Dashboard" id="main-dashboard" %}
    <script src="{% static 'wireview/wireview.min.js' %}"></script>
  </body>
</html>
