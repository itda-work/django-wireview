# --- Not published -------------------------------------------------------------------------------
# Design and implementation notes, the gap analysis and the roadmap are for the library's
# developers. A pattern is a path, or a directory followed by "/**" for every file beneath it.
# Files outside docs/ other than the root README.md are never published; the site links them on
# GitHub at the release tag.

[exclude]
paths = [
    "docs/design/**",
    "docs/implementation/**",
    "docs/legacy/**",
    "docs/FEATURE-GAP.md",
    "docs/ROADMAP.md",
]
