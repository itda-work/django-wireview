<li id="activities-{{ item.pk }}"
    style="display: flex;
           align-items: flex-start;
           gap: 12px;
           padding: 12px 0;
           border-bottom: 1px solid #eee">
  <!-- Activity type icon -->
  <div style="width: 36px;
              height: 36px;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 14px;
              {% if item.type == 'login' %} background: #e0f2fe;
              color: #0369a1;
              {% elif item.type == 'purchase' %} background: #dcfce7;
              color: #16a34a;
              {% elif item.type == 'upload' %} background: #fef3c7;
              color: #d97706;
              {% elif item.type == 'comment' %} background: #f3e8ff;
              color: #9333ea;
              {% else %} background: #f3f4f6;
              color: #6b7280;
              {% endif %}">
    {% if item.type == 'login' %}
      &#x1F464;
    {% elif item.type == 'purchase' %}
      &#x1F4B0;
    {% elif item.type == 'upload' %}
      &#x1F4C1;
    {% elif item.type == 'comment' %}
      &#x1F4AC;
    {% else %}
      &#x1F504;
    {% endif %}
  </div>
  <!-- Content -->
  <div style="flex: 1; min-width: 0;">
    <p style="margin-bottom: 2px;">
      <strong>{{ item.user_name }}</strong>
      <span style="color: #666;">{{ item.description }}</span>
    </p>
    <p style="font-size: 12px; color: #999;">{{ item.created_at|timesince }} ago</p>
  </div>
</li>
