{% load wireview %}

<div {% live_tag_header %}>
  <span data-testid="{{ this.id }}-count">{{ this.count }}</span>
  <button data-testid="{{ this.id }}-bump" {% on "click" "bump" myself=True %}>bump</button>
  <button data-testid="{{ this.id }}-vanish"
          {% on "click" "vanish" myself=True %}>vanish</button>
  <input data-testid="{{ this.id }}-field"
         name="field"
         {% on "keypress.enter" "vanish" myself=True %}
         {% on "blur" "blurred" myself=True %}>
</div>
