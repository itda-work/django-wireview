{% load wireview %}

<!DOCTYPE html>
<html>
  <head>
    <title>stream probe</title>
    {% wireview_header %}
    <style>li.row { height: 80px; }</style>
  </head>
  <body>
    {% if away %}
      <a href="?size={{ size }}" data-testid="back">back</a>
    {% else %}
      <a href="?size={{ size }}&away=1" data-testid="away">away</a>
      {% component 'StreamProbe' id="probe" size=size delay=delay nest=nest seeded=seeded %}
      {% if pair %}
        <section data-testid="second">
          {% component 'StreamProbe' id="probe-2" size=1 %}
        </section>
      {% endif %}
    {% endif %}
  </body>
</html>
