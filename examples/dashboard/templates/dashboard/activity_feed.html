{% load wireview %}

<div {% tag_header %}>
  <div class="activity-feed">
    <ul wire-stream="activities" style="list-style: none;">
      {# Items arrive as stream operations; the first one, the join's reset, empties this list #}
    </ul>
    {# Outside the list, which a reset empties: base.html shows it while the list holds nothing #}
    <p class="empty-activity">No activity yet</p>
    {% if has_more %}
      <div style="text-align: center; margin-top: 16px;">
        <button class="btn"
                {% on 'click' 'load_more' %}
                {% if is_loading %}disabled{% endif %}>
          {% if is_loading %}
            Loading...
          {% else %}
            Load More
          {% endif %}
        </button>
      </div>
    {% endif %}
  </div>
</div>
