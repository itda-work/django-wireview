name: CI

# GitHub Actions 사용을 최소화한다 — 평소 검증은 로컬 `make ci-test` 로 하고, 이 워크플로는 필요할 때만 수동 실행한다.
# release.yml 이 태그 커밋에 대해 이 워크플로 전체를 부르고(workflow_call), 모든 job이 통과해야 배포한다(#122).
# 그래서 여기 job을 더하면 릴리스 게이트도 함께 넓어진다. 예외는 vscode-extension-host 하나다 — VS Code를 내려받아
# 띄우는 편집기 확장의 호스트 테스트는 파이썬 패키지의 배포를 막지 않는다(release 입력, #156).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Called by release.yml as its gate; the jobs outside the gate are skipped
        type: boolean
        default: false

# Runners are pinned (not ubuntu-latest) for the reason release.yml gives.
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # docs/COMPATIBILITY.md: the Django releases Django supports, on Python 3.12 and up.
        # `make test-matrix` runs the same grid locally.
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install "django~=${{ matrix.django-version }}.0"

      # wireview.W004's tests and testproj's clean-checks bar look for the built bundle,
      # which is gitignored. Without this step they fail on every runner.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies and build JS
        run: |
          npm ci
          npm run build

      # tests/test_nats_layer.py starts this binary itself, and fails without it where CI is
      # set: channels' floor rests on those tests (#132). Lifted from the image test-e2e runs
      # as a service, the release docs/COMPATIBILITY.md names; the binary is static.
      - name: Install nats-server
        run: |
          docker create --name nats-server nats:2.14-alpine
          docker cp nats-server:/usr/local/bin/nats-server "$RUNNER_TEMP/nats-server"
          docker rm nats-server
          "$RUNNER_TEMP/nats-server" --version
          echo "NATS_SERVER=$RUNNER_TEMP/nats-server" >> "$GITHUB_ENV"

      - name: Run tests
        run: make ci-test DJANGO=${{ matrix.django-version }}

  # The lock pins what the job above installs; a fresh install resolves anew and gets
  # the newest releases. This job runs what a new user gets (#127).
  test-latest:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies and build JS
        run: |
          npm ci
          npm run build

      # tests/test_nats_layer.py starts this binary itself, and fails without it where CI is
      # set: channels' floor rests on those tests (#132). Lifted from the image test-e2e runs
      # as a service, the release docs/COMPATIBILITY.md names; the binary is static.
      - name: Install nats-server
        run: |
          docker create --name nats-server nats:2.14-alpine
          docker cp nats-server:/usr/local/bin/nats-server "$RUNNER_TEMP/nats-server"
          docker rm nats-server
          "$RUNNER_TEMP/nats-server" --version
          echo "NATS_SERVER=$RUNNER_TEMP/nats-server" >> "$GITHUB_ENV"

      - name: Run tests on the newest dependencies
        run: make test-latest

  # The other end: the oldest release of each runtime dependency pyproject.toml allows.
  # Nothing else installs them, so a floor that no longer works goes unseen (#132).
  test-lowest:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies and build JS
        run: |
          npm ci
          npm run build

      # tests/test_nats_layer.py starts this binary itself, and fails without it where CI is
      # set: channels' floor rests on those tests (#132). Lifted from the image test-e2e runs
      # as a service, the release docs/COMPATIBILITY.md names; the binary is static.
      - name: Install nats-server
        run: |
          docker create --name nats-server nats:2.14-alpine
          docker cp nats-server:/usr/local/bin/nats-server "$RUNNER_TEMP/nats-server"
          docker rm nats-server
          "$RUNNER_TEMP/nats-server" --version
          echo "NATS_SERVER=$RUNNER_TEMP/nats-server" >> "$GITHUB_ENV"

      - name: Run tests on the lowest dependencies
        run: make test-lowest

  # E2E on every channel layer docs/COMPATIBILITY.md supports across processes (#130).
  # Both brokers start on every leg, which keeps the job simple; the one a leg does not
  # use costs a few seconds. The image tags are the broker releases the table names.
  test-e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        layer: ["nats", "redis"]

    services:
      nats:
        image: nats:2.14-alpine
        ports:
          - 4222:4222
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies and build JS
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run E2E tests on ${{ matrix.layer }}
        run: make ci-test-e2e LAYER=${{ matrix.layer }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make ci-install

      - name: Run linting
        run: make ci-lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make ci-install

      - name: Run pyright
        run: make ci-check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run client unit tests
        run: npm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make ci-install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Build and check
        run: make ci-build

  # The editor extension (#156). Its contract with the library -- the metadata version,
  # the tag tables, no diagnostics on this repository's templates -- runs in the test
  # jobs above (tests/test_vscode_extension.py); this job checks the extension itself.
  vscode-extension:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit and grammar tests
        run: npm test

      - name: Package
        run: npm run package

  # The extension in a real VS Code. Outside the release gate: it downloads VS Code,
  # and a download that fails must not hold back the Python package.
  vscode-extension-host:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      # The host tests make the metadata from the test project with `uv run`
      - name: Set up Python
        working-directory: .
        run: |
          uv python install 3.12
          uv sync --all-extras

      - name: Install npm dependencies
        run: npm ci

      # In the VS Code release engines.vscode names, which test/host/run.mjs downloads
      - name: Smoke tests in VS Code
        run: xvfb-run -a npm run test:host
