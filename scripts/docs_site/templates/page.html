<!DOCTYPE html>
<!--
  The documentation site's page (#159), filled by scripts/docs_site/build.py with string.Template.
  Header, footer and theme toggle follow itda.work (itda-skills/website at
  00f656a1cd95e2f7627d3c5c04fd3f5d2b066592: templates/base.html,
  templates/partials/header.html, footer.html, theme_toggle.html); assets/site.css says what
  was taken from where. No inline script: itda.work serves its pages without one.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="${boot_js}"></script>
    <title>${title}</title>
    <meta name="description" content="${description}">
    ${robots}
    <link rel="canonical" href="${canonical}">
    <link rel="alternate" type="text/markdown" href="${markdown_url}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="${canonical}">
    <meta property="og:title" content="${title}">
    <meta property="og:description" content="${description}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="${site_css}">
    <script src="${site_js}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="brand">
          <a class="brand__home" href="https://itda.work/">스킬.잇다</a>
          <span class="brand__sep" aria-hidden="true">/</span>
          <a class="brand__docs" href="${home_url}">django-wireview 문서</a>
        </div>
        <div class="site-header__actions">
          <a class="header-link header-link--wide" href="${repository}">GitHub</a>
          <a class="header-link header-link--wide"
             href="https://pypi.org/project/django-wireview/">PyPI</a>
          <button id="theme-toggle"
                  class="icon-button theme-toggle"
                  type="button"
                  aria-label="다크 모드 전환">
            <svg class="icon-sun"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg class="icon-moon"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
          <button id="menu-button"
                  class="icon-button menu-button"
                  type="button"
                  aria-label="문서 목차"
                  aria-controls="sidebar"
                  aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </header>
    ${preview}
    <div class="${layout_class}">
      <nav id="sidebar" class="sidebar" aria-label="문서 목차">
        ${sidebar}
      </nav>
      <main class="article">
        <article class="prose">
          ${title_html}
          ${page_meta}
          ${body}
        </article>
        ${pager}
        <div class="page-source">
          <a href="${markdown_url}">원문 Markdown</a>
          <a href="${source_url}">GitHub에서 보기 (${tag})</a>
        </div>
      </main>
      ${toc}
    </div>
    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>django-wireview ${version} · MIT 라이선스</span>
        <nav aria-label="바깥 링크">
          <a href="https://itda.work/">스킬.잇다</a>
          <a href="${repository}">GitHub</a>
          <a href="https://pypi.org/project/django-wireview/">PyPI</a>
          <a href="${changelog}">변경 이력</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
