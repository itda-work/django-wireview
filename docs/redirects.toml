# Site paths that moved (#158). The site publishes only the latest release, so a page whose URL
# changes would 404 for every old link; each entry here makes the build leave a page at the old
# path that sends the reader on.
#
# The files the site publishes as they are -- llms.txt and the agent skill's Markdown (#164) -- are
# public URLs too, and move the same way: the build leaves a short file of the same kind at the old
# path that says, in Korean, that it moved and gives the new absolute URL (an agent reads it as text;
# a static host has no redirect to give it).
#
# Format: one entry per moved path, both sides site paths as docs/site.toml builds them.
#
#   [[redirects]]
#   from = "/wireview/tutorial/todo/"
#   to = "/wireview/tutorial/todo-app/"
#
#   [[redirects]]
#   from = "/wireview/agent/wireview/references/testing.md"
#   to = "/wireview/agent/wireview/references/testing-guide.md"
#
# Rules (scripts/docs_site/nav.py's check_redirects; the build and tests/test_doc_site.py check them):
#   - Paths start with the site's base, "/wireview/".
#   - A page's paths end with "/"; "to" is a page of the current navigation.
#   - A file's paths end with the same extension; "to" is a file the site publishes as it is.
#     A page never moves to a file, nor a file to a page.
#   - "from" is not published any more: a path still in use does not redirect.
#   - No chains: when a page moves again, point its older entries at the new path too.
#   - Each "from" appears once.
#
# Entries are never removed; a link published once may still be out there.

redirects = []
