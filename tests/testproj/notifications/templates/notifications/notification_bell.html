{% load wireview %}

<div {% tag_header %} class="bell-container">
  <button
    type="button"
    class="bell-button"
    {% on 'click' 'toggle_dropdown' %}
    aria-label="Notifications"
  >
    <svg class="bell-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
    </svg>
    {% if this.unread_count > 0 %}
      <span class="bell-badge">{{ this.unread_count }}</span>
    {% endif %}
  </button>

  <div {% class {'notification-dropdown': True, 'is-open': is_open} %}>
    <div class="dropdown-header">
      <h3>Notifications</h3>
      <div class="dropdown-actions">
        <button {% on 'click' 'close_dropdown' %}>&times; Close</button>
      </div>
    </div>
    <div class="dropdown-content">
      <p style="padding: 20px; color: #65676b; text-align: center;">
        See all notifications below
      </p>
    </div>
  </div>
</div>
