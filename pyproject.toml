[project]
name = "django-wireview"
version = "0.2.1"
description = "Brings LiveView from Phoenix framework into Django"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Eddy Ernesto del Valle Pino", email = "eddy@edelvalle.me" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "channels>=4,<5",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-playwright>=0.4.0",
    "djlint",
    "ruff",
    # The build backend, so the packaging guard in tests/test_agent_skill.py can ask it
    # what the sdist would contain instead of asking pyproject what it says.
    "hatchling",
    "pre-commit",
    "ipython",
    "whitenoise",
    "channels-redis",
    "channels-nats",
    "django-hmin",
    "django-stubs",
    "django-stubs-ext",
    "pyright",
    "twine",
    "daphne",
    "uvicorn",
    "websockets",
    "lxml",
    "cssselect",
    "psutil>=7.2.2",
]

[project.urls]
Homepage = "https://github.com/itda-work/django-wireview"
Repository = "https://github.com/itda-work/django-wireview"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# wireview.min.js is a build artifact and is gitignored, so hatchling would leave it out.
# Without it {% wireview_header %} points at a file the installed package does not have.
[tool.hatch.build]
artifacts = ["wireview/static/wireview/*.min.js"]

[tool.hatch.build.targets.wheel]
packages = ["wireview"]

# The agent skill lives at the repository root so this repository can dogfood it
# through .claude/skills/wireview. Ship it inside the package as well, where
# `manage.py wireview_agent_setup` can find it in an installed project.
[tool.hatch.build.targets.wheel.force-include]
"skills/wireview" = "wireview/agent_skills/wireview"

[tool.hatch.build.targets.sdist]
include = [
    "wireview",
    "skills",
    "README.md",
    "CHANGELOG.md",
]

# The sdist has to carry skills/wireview, and `include` cannot make it: hatchling's
# walk skips a nested directory whose name matches the package, so `skills/wireview`
# is invisible to it while `skills/anything-else` is not. Without this the sdist
# shipped without the skill, and since `uv build` builds the wheel *from the sdist*,
# the wheel's own force-include then failed on a directory that was right there in
# the working tree. It failed the same way at v0.2.1.
[tool.hatch.build.targets.sdist.force-include]
"skills/wireview" = "skills/wireview"

# Tool configurations

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# ASGI config requires imports after django.setup()
"tests/testproj/asgi.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
indent = 2
ignore = "H030,H031"
profile = "django"
use-gitignore = true
max_line_length = 120
blank_line_after_tag = "load, extends"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
exclude = [".git", "tests/", "**/__pycache__", "**/migrations"]
reportPrivateUsage = false

[tool.django-stubs]
django_settings_module = "tests.testproj.settings"

[tool.pytest.ini_options]
python_files = "test*.py"
addopts = "--ff -v --nomigrations --strict-markers"
DJANGO_SETTINGS_MODULE = "testproj.settings"
pythonpath = [".", "tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "e2e: marks end-to-end tests (requires browser)",
    "real_templates: render through the project's own template engine, not a test override",
]
filterwarnings = [
    # An exception on a background thread is reported after the run, as a warning
    # beneath a green summary, and the E2E suites all run a server on one. That is
    # how four copies of a settings-override race lived in the harness unnoticed.
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[dependency-groups]
dev = [
    "pytest-playwright>=0.4.0",
]
