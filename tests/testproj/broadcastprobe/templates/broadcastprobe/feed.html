{% load wireview %}

<section {% tag_header %}>
  <form {% on "submit.prevent" "post" %}>
    <input name="text" data-testid="text">
  </form>
  <button data-testid="ping" {% on "click" "ping" %}>ping</button>
  <span data-testid="flag">flag</span>
  <span wire-hook="BroadcastHeard" id="heard" data-testid="heard"></span>
  <ul data-testid="items" wire-stream="items">
  </ul>
</section>
