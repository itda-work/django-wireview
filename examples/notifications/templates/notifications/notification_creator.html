{% load wireview %}

<div {% tag_header %} class="creator-card">
  <h2>Send a Notification</h2>
  <div class="form-group">
    <label for="recipient">To</label>
    <select name="recipient" id="recipient" {% on 'change' 'set_recipient' %}>
      <option value="" {% cond {'selected': not recipient} %}>Me
      </option>
      {% for username in this.usernames %}
        {% if username != this.user.username %}
          <option value="{{ username }}" {% cond {'selected': recipient == username} %}>{{ username }}
          </option>
        {% endif %}
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label for="title">Title</label>
    <input type="text"
           name="title"
           id="title"
           placeholder="Enter notification title"
           value="{{ title }}"
           {% on 'input' 'set_title' %} />
  </div>
  <div class="form-group">
    <label for="message">Message</label>
    <textarea name="message"
              id="message"
              placeholder="Enter notification message (optional)"
              {% on 'input' 'set_message' %}>{{ message }}</textarea>
  </div>
  <div class="form-group">
    <label>Type</label>
    <div class="type-buttons">
      <button type="button"
              {% class {'type-button': True, 'selected': type == 'info'} %}
              {% on 'click' 'set_type' type='info' %}>
        Info
      </button>
      <button type="button"
              {% class {'type-button': True, 'selected': type == 'success'} %}
              {% on 'click' 'set_type' type='success' %}>
        Success
      </button>
      <button type="button"
              {% class {'type-button': True, 'selected': type == 'warning'} %}
              {% on 'click' 'set_type' type='warning' %}>
        Warning
      </button>
      <button type="button"
              {% class {'type-button': True, 'selected': type == 'error'} %}
              {% on 'click' 'set_type' type='error' %}>
        Error
      </button>
    </div>
  </div>
  <button type="button"
          class="submit-btn"
          data-testid="send-notification"
          {% cond {'disabled': not this.can_send} %}
          {% on 'click' 'create' %}>
    Send Notification
  </button>
  <button type="button"
          class="submit-btn"
          data-testid="send-toast"
          {% cond {'disabled': not this.can_send} %}
          {% on 'click' 'send_toast' %}>
    Send Toast
  </button>
  <p style="color: #65676b; font-size: 0.9rem;">
    A notification is stored and waits in the list. A toast shows on the pages open right now and is gone.
  </p>
</div>
