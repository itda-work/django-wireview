{% load wireview %}

<!DOCTYPE html>
<html>
  <head>
    <title>file probe</title>
    {% wireview_header %}
  </head>
  <body>
    <h1 data-testid="page">{{ request.GET.visit|default:"probe" }}</h1>
    <nav>
      <a href="{% url 'fileprobe:other' %}" data-testid="to-other">other</a>
      <a href="{% url 'fileprobe:index' %}?visit=again" data-testid="again">again</a>
      <a href="{% url 'fileprobe:index' %}?visit=manual&manual=1"
         data-testid="manual">manual</a>
    </nav>
    {% component 'FileProbe' id="probe" manual=request.GET.manual %}
  </body>
</html>
