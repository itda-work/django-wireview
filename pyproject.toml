[project]
name = "django-wireview"
version = "1.3.0"
description = "Brings LiveView from Phoenix framework into Django"
# readme and urls: hatch_build.py pins their links to the release tag
dynamic = ["readme", "urls"]
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Eddy Ernesto del Valle Pino", email = "eddy@edelvalle.me" },
]
maintainers = [
    { name = "Chinseok Lee", email = "dev@itda.work" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
    # The floors are what `make test-lowest` installs and passes on (#132). channels-nats
    # 0.2.0 declares channels>=4 but calls require_valid_channel_name, new in channels 4.2.1.
    # pydantic before 2.7 rejects Component's field serializer at import; 2.9.0 cannot
    # evaluate its ClassVar annotations, which 2.9.1 fixed.
    "channels>=4.2.1,<5",
    "pydantic>=2.7,!=2.9.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-playwright>=0.4.0",
    "djlint",
    "ruff",
    # The build backend, so the packaging guard in tests/test_agent_skill.py can ask it
    # what the sdist would contain instead of asking pyproject what it says.
    "hatchling",
    "pre-commit",
    "ipython",
    "whitenoise",
    "channels-redis",
    # 0.7.0 requires Python 3.13, and without the cap the lock forks: CI's E2E lane runs on
    # 3.12 and would verify one version while 3.13+ dev environments ran another (#150).
    "channels-nats<0.7",
    "django-stubs",
    "django-stubs-ext",
    "pyright",
    "twine",
    "daphne",
    "uvicorn",
    "websockets",
    "lxml",
    "cssselect",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatch_build.py: the long description is README.md, and the project URLs are these, with
# their links into the repository pinned to the release tag. Documentation is the site
# (itda.work/wireview/), which has no tag in its URL: it shows the newest release (#157, #166).
[tool.hatch.metadata.hooks.custom.urls]
Homepage = "https://github.com/itda-work/django-wireview"
Repository = "https://github.com/itda-work/django-wireview"
Documentation = "https://itda.work/wireview/"
Changelog = "https://github.com/itda-work/django-wireview/blob/main/CHANGELOG.md"
Issues = "https://github.com/itda-work/django-wireview/issues"

# wireview.min.js is a build artifact and is gitignored, so hatchling would leave it out.
# Without it {% wireview_header %} points at a file the installed package does not have.
[tool.hatch.build]
artifacts = ["wireview/static/wireview/*.min.js"]

[tool.hatch.build.targets.wheel]
packages = ["wireview"]

# The agent skill lives at the repository root so this repository can dogfood it
# through .claude/skills/wireview. hatch_build.py ships it inside the package as well,
# as wireview/agent_skills/wireview with its links pinned to the release tag, where
# `manage.py wireview_agent_setup` can find it in an installed project. It ships the
# editor extension's diagnostics too (editors/vscode/src/core and scripts/diagnose.ts,
# not the extension), as wireview/template_diagnostics, for `manage.py
# wireview_check_templates` (#179).
[tool.hatch.build.targets.wheel.hooks.custom]

# Anchored at the root: a pattern without the slash matches at any depth, and
# "README.md" took every README in the repository into the sdist -- the
# examples', the docs', and editors/vscode/node_modules' hundreds.
[tool.hatch.build.targets.sdist]
include = [
    "/wireview",
    "/skills",
    "/editors/vscode/src/core",
    "/editors/vscode/scripts/diagnose.ts",
    "/README.md",
    "/hatch_build.py",
    "/CHANGELOG.md",
    "/LICENSE",
]

# The sdist has to carry skills/wireview, and `include` cannot make it: hatchling's
# walk skips a nested directory whose name matches the package, so `skills/wireview`
# is invisible to it while `skills/anything-else` is not. Without this the sdist
# shipped without the skill, and since `uv build` builds the wheel *from the sdist*,
# the wheel's copy of it (now hatch_build.py) then failed on a directory that was right there in
# the working tree. It failed the same way at v0.2.1.
[tool.hatch.build.targets.sdist.force-include]
"skills/wireview" = "skills/wireview"

# Tool configurations

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# ASGI config requires imports after django.setup()
"tests/testproj/asgi.py" = ["E402"]
"bench/compare_fastapi/wv/asgi.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
indent = 2
ignore = "H030,H031"
profile = "django"
use-gitignore = true
max_line_length = 120
blank_line_after_tag = "load, extends"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
exclude = [".git", "tests/", "**/__pycache__", "**/migrations"]
reportPrivateUsage = false

[tool.django-stubs]
django_settings_module = "tests.testproj.settings"

[tool.pytest.ini_options]
python_files = "test*.py"
addopts = "-v --nomigrations --strict-markers"
# A hung test stops the run with every thread's stack instead of holding it until the CI
# job's limit (testproj/time_limit.py, #148). The slowest test takes about five seconds.
test_time_limit = 60
DJANGO_SETTINGS_MODULE = "testproj.settings"
pythonpath = [".", "tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "e2e: marks end-to-end tests (requires browser)",
    "real_templates: render through the project's own template engine, not a test override",
]
filterwarnings = [
    # An exception on a background thread is reported after the run, as a warning
    # beneath a green summary, and the E2E suites all run a server on one. That is
    # how four copies of a settings-override race lived in the harness unnoticed.
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.uv]
default-groups = ["dev", "docs"]

[dependency-groups]
dev = [
    "pytest-playwright>=0.4.0",
]
# What scripts/docs_site renders the documentation site with (make docs-site, #159). Not a
# runtime dependency. A default group, so `uv sync` and `uv run` install it and `make test`
# runs the build's tests; the runs outside the project (test-latest, test-lowest) add it
# themselves, and tests/test_docs_site_build.py fails where CI is set if it is missing.
docs = [
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
]
