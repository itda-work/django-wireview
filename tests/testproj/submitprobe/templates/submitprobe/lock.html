{% load wireview %}

<div {% tag_header %}>
  <form id="lock-form" data-testid="form" {% on "submit.prevent" "slow" %}>
    <input type="text" name="note" data-testid="note">
    <textarea name="body" data-testid="body"></textarea>
    <input type="text" name="fixed" value="fixed" readonly data-testid="fixed">
    <input type="checkbox" name="agree" data-testid="agree">
    <select name="size" data-testid="size">
      <option>s</option>
      <option>m</option>
    </select>
    <button type="button" data-testid="plain-button">Plain</button>
    <button type="button" disabled data-testid="off-button">Off</button>
    <button type="submit"
            name="go"
            value="1"
            data-testid="save"
            wire-disabled-with="Saving...">Save</button>
  </form>
  <input type="text" name="outside" form="lock-form" data-testid="outside">
  <form data-testid="finish-form" {% on "submit.prevent" "finish" %}>
    <input type="text" name="any" data-testid="finish-field">
    <button type="submit"
            data-testid="finish"
            {% if this.finished %}disabled{% endif %}>Finish</button>
  </form>
  <form data-testid="broken-form" {% on "submit.prevent" "broken" %}>
    <input type="text" name="any" data-testid="broken-field">
    <button type="submit" data-testid="broken">Break</button>
  </form>
  <span data-testid="saved">{{ this.saved }}</span>
  <span data-testid="saved-note">{{ this.note }}</span>
</div>
