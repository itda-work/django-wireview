{% load wireview %}

<div {% tag_header %}>
  {# Bottom up: the newest message is first in the list and drawn last, and the view stays at the bottom #}
  <div class="message-list"
       style="height: 400px;
              overflow-y: auto;
              display: flex;
              flex-direction: column-reverse;
              border: 1px solid #ddd;
              border-radius: 4px;
              padding: 16px;
              background: #fafafa">
    <ul wire-stream="messages"
        style="list-style: none;
               display: flex;
               flex-direction: column-reverse">
      {% for item in messages %}
        {% include "chat/message_list_item.html" %}
      {% empty %}
        <li class="empty-message"
            style="color: #999;
                   text-align: center;
                   padding: 20px">No messages yet. Start the conversation!</li>
      {% endfor %}
    </ul>
  </div>
</div>
