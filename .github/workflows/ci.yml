name: CI

# GitHub Actions 사용을 최소화한다 — 평소 검증은 로컬 `make ci-test` 로 하고, 이 워크플로는 필요할 때만 수동 실행한다.
# release.yml 이 태그 커밋에 대해 이 워크플로 전체를 부르고(workflow_call), 모든 job이 통과해야 배포한다(#122).
# 그래서 여기 job을 더하면 릴리스 게이트도 함께 넓어진다.
on:
  workflow_dispatch:
  workflow_call:

# Runners are pinned (not ubuntu-latest) for the reason release.yml gives.
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # docs/COMPATIBILITY.md: the Django releases Django supports, on Python 3.12 and up.
        # `make test-matrix` runs the same grid locally.
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install "django~=${{ matrix.django-version }}.0"

      # wireview.W004's tests and testproj's clean-checks bar look for the built bundle,
      # which is gitignored. Without this step they fail on every runner.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies and build JS
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: make ci-test DJANGO=${{ matrix.django-version }}

  # The lock pins what the job above installs; a fresh install resolves anew and gets
  # the newest releases. This job runs what a new user gets (#127).
  test-latest:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies and build JS
        run: |
          npm ci
          npm run build

      - name: Run tests on the newest dependencies
        run: make test-latest

  test-e2e:
    runs-on: ubuntu-24.04

    services:
      nats:
        image: nats:2.14-alpine
        ports:
          - 4222:4222

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies and build JS
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run E2E tests
        run: make ci-test-e2e

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make ci-install

      - name: Run linting
        run: make ci-lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make ci-install

      - name: Run pyright
        run: make ci-check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run client unit tests
        run: npm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # publishes no floating major tag since v8
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make ci-install

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Build and check
        run: make ci-build
