{% load static wireview %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}Book Search{% endblock %}
    </title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
      }
      h1 {
        color: white;
        text-align: center;
        margin-bottom: 30px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      }
      .search-container {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      }
      .search-wrapper {
        position: relative;
      }
      .search-input-group {
        display: flex;
        gap: 10px;
      }
      .search-input {
        flex: 1;
        padding: 15px 20px;
        font-size: 1.1rem;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search-input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      }
      .search-input.wireview-loading {
        background-image: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .clear-btn {
        padding: 15px 20px;
        background: #f0f0f0;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.2s;
      }
      .clear-btn:hover {
        background: #e0e0e0;
      }
      .dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        margin-top: 8px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        overflow: hidden;
        z-index: 100;
        max-height: 400px;
        overflow-y: auto;
      }
      .dropdown-item {
        padding: 15px 20px;
        cursor: pointer;
        transition: background 0.15s;
        border-bottom: 1px solid #f0f0f0;
      }
      .dropdown-item:last-child {
        border-bottom: none;
      }
      .dropdown-item:hover,
      .dropdown-item.highlighted {
        background: #f8f9ff;
      }
      .dropdown-item.highlighted {
        background: #667eea;
        color: white;
      }
      .dropdown-item.highlighted .book-author,
      .dropdown-item.highlighted .book-meta {
        color: rgba(255,255,255,0.8);
      }
      .book-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .book-author {
        color: #666;
        font-size: 0.9rem;
      }
      .book-meta {
        color: #999;
        font-size: 0.8rem;
        margin-top: 4px;
      }
      .selected-book {
        margin-top: 30px;
        padding: 25px;
        background: linear-gradient(135deg, #f8f9ff 0%, #fff 100%);
        border-radius: 12px;
        border: 2px solid #667eea;
      }
      .selected-book h3 {
        margin: 0 0 10px 0;
        color: #667eea;
      }
      .selected-book p {
        margin: 5px 0;
        color: #555;
      }
      .keyboard-hint {
        margin-top: 15px;
        padding: 15px;
        background: #f8f9ff;
        border-radius: 8px;
        font-size: 0.85rem;
        color: #666;
      }
      .keyboard-hint kbd {
        display: inline-block;
        padding: 3px 8px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.85em;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      }
      .no-results {
        padding: 20px;
        text-align: center;
        color: #999;
      }
    </style>
    {% wireview_header %}
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
