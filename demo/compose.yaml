# The public demo: docker compose up -d (demo/README.md).
# The tunnel to wireview-demo.itda.work is a profile of its own: docker compose --profile tunnel up -d
name: wireview-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: wireview-demo-app:${DEMO_TAG:-latest}
  build:
    context: ..
    dockerfile: demo/Dockerfile
    target: app
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379
    LIMITS_REDIS_URL: redis://limits:6379/0
    DEMO_DATA_DIR: /data
  volumes:
    - data:/data
  restart: unless-stopped
  logging: *logging

services:
  app:
    <<: *app
    depends_on:
      redis:
        condition: service_healthy
      limits:
        condition: service_healthy
    # Readiness: the channel layer carries a message and the limits' Redis answers (demo/views.py)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Long enough for uvicorn's graceful shutdown (20s) to run every leaving()
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  janitor:
    <<: *app
    command: ["python", "demo/manage.py", "demo_janitor"]
    depends_on:
      app:
        condition: service_healthy
    # Healthy while its rounds succeed (each one touches /data/janitor.ok) and the limits' Redis
    # is under 80% of its memory (past it, /data/limits.full is there; demo_janitor). Docker does
    # not restart an unhealthy container; `docker compose ps` shows it (README "장애 때 볼 것")
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/data/janitor.ok') > 120 or os.path.exists('/data/limits.full'))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  web:
    image: wireview-demo-web:${DEMO_TAG:-latest}
    build:
      context: ..
      dockerfile: demo/Dockerfile
      target: web
    depends_on:
      app:
        condition: service_healthy
    # The host's own address only: the public way in is the tunnel. Caddy runs as a user of its
    # own and listens on 8080, a port that needs no privilege (demo/Dockerfile)
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  redis:
    image: redis:7.4-alpine
    # The channel layer only: nothing worth keeping across a restart. channels_redis gives every
    # key an expiry, so under pressure the oldest undelivered messages go (volatile-lru)
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192m

  # The rate-limit counters (demo/limits.py), apart from the channel layer: a flood of channel
  # messages must not evict a count, or the limit it keeps would let go. This one evicts nothing
  # (noeviction): full, it refuses writes, and the limits then refuse visitors (1013, 503) until
  # windows expire. No key outlives its window -- ten seconds to an hour -- and an open socket's
  # lease lapses 90 seconds after its last renewal, so what it holds is what the last hour's
  # visitors left: a key is ~100 bytes, 32 MB some 250,000 of them. The janitor logs an ERROR
  # and turns unhealthy past 80% (demo_janitor).
  limits:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.9.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

volumes:
  data:
