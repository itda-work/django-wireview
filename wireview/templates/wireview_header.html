{% load static %}

<meta name="wireview-boost" data-enabled="{{ BOOST_PAGES|lower }}" />
<meta name="wireview-live-session" content="{{ LIVE_SESSION }}" />
<meta name="wireview-reconnect"
      data-min-delay="{{ RECONNECT.min_delay|stringformat:"s" }}"
      data-jitter="{{ RECONNECT.jitter|stringformat:"s" }}"
      data-max-delay="{{ RECONNECT.max_delay|stringformat:"s" }}"
      data-grow-factor="{{ RECONNECT.grow_factor|stringformat:"s" }}" />
{# The nonce goes inside each tag; reformatting would spread the rendered tags over lines. #}
{# djlint:off #}
<style{% if CSP_NONCE %} nonce="{{ CSP_NONCE }}"{% endif %}>
  .wireview-disconnected, .wireview-disconnected * {
    opacity: 0.8; cursor: wait; pointer-events: none;
  }
</style>
<script defer src="{% static "wireview/wireview.min.js" %}?v={{ BUNDLE_VERSION }}"{% if CSP_NONCE %} nonce="{{ CSP_NONCE }}"{% endif %}></script>
{% for path in HOOK_FILES %}
  <script defer src="{% static path %}"{% if CSP_NONCE %} nonce="{{ CSP_NONCE }}"{% endif %}></script>
{% endfor %}
{# djlint:on #}
