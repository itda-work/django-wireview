{% load wireview %}

<div {% tag_header %}>
  <b data-testid="count">{{ count }}</b>
  <ul data-testid="messages">
    {% for m in messages %}
      {% component 'TempRow' id=m text=m %}
    {% endfor %}
  </ul>
  <button data-testid="load" {% on "click" "load" %}>load</button>
  <button data-testid="bump" {% on "click" "bump" %}>bump</button>
</div>
